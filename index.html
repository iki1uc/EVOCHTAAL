<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>EVOCHTAAL · Dream Station</title>

<style>
    body {
        font-family: monospace;
        background: #111;
        color: #eee;
        padding: 40px;
        text-align: center;
    }
    suite {
        display: block;
        font-size: 34px;
        margin-bottom: 20px;
        font-weight: bold;
        color: #9cf;
    }
    slide {
        display: block;
        font-size: 18px;
        margin-bottom: 20px;
        opacity: 0.7;
        color: #ccc;
    }
    .puzzle {
        font-size: 26px;
        padding: 20px;
        border: 2px dashed #9cf;
        display: inline-block;
        margin-top: 20px;
    }
    .axis {
        margin-top: 40px;
        font-size: 20px;
        line-height: 1.8;
        color: #cfc;
    }
</style>
</head>

<body>

<suite>EVOCHTAAL</suite>
<slide>dimension.flow()</slide>

<div class="puzzle" data-piece="EVOCHTAAL">
    ((( EVO · CHTAAL · Dream Station )))
</div>

<div class="axis">
    up – Streben<br>
    down – Ruhe<br>
    left – Haltung<br>
    right – Ausgleich<br>
    main – Vorwärts<br>
    back – Suite · Rückgabe<br>
    in – Aufnahme<br>
    out – Abgabe
</div>

<script>
// EVOCHTAAL – Dream Station Startsignal
console.log("EVOCHTAAL geladen: Traum-Ebene aktiv");

// 8-Bewegung · AXIOMIAT
const AXIOMIAT = {
    up: "Streben",
    down: "Ruhe",
    left: "Haltung",
    right: "Ausgleich",
    main: "Vorwärts",
    back: "Suite · Rückgabe",
    in: "Aufnahme",
    out: "Abgabe",
    stamp: Date.now()
};

console.log("AXIOMIAT:", AXIOMIAT);

// Echo · CHTAAL
function CHTAAL(ideal) {
    return {
        echo: ideal,
        mode: "CHTAAL · Rückgabe",
        stamp: Date.now()
    };
}

console.log("CHTAAL:", CHTAAL("EVO · Ideal"));
</script>

</body>
</html>
